<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#e9ebef;--mut:#8b919e;--acc:#ff7a1a;--win:#3ecf8e;--loss:#ef5b5b;--f:#c084fc;--in:#11141a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,sans-serif}
header{padding:18px 16px 8px;max-width:900px;margin:auto}
h1{font:800 30px/1 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.5px;text-transform:uppercase}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:900px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button,.seg button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 14px Inter;white-space:nowrap;cursor:pointer}
nav button.on,.seg button.on{background:var(--acc);border-color:var(--acc);color:#111}
nav button.adm{border-style:dashed}
nav button.adm.on{border-style:solid}
main{max-width:900px;margin:auto;padding:14px 16px 80px}
h2{font:800 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:14px 0 8px}
h3{font:800 17px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 6px;letter-spacing:.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.adminbox{border-style:dashed;border-color:#5a3a1f}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:500;text-align:left;padding:6px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#1f232c}
.rank{font:800 18px 'Barlow Condensed';color:var(--mut);width:34px}
.top .rank{color:var(--acc)}
.pts{font:800 20px 'Barlow Condensed';color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);margin-left:4px;vertical-align:1px}
.tag.ok{color:var(--win);border-color:#2a5d47}
.tag.live{color:#111;background:var(--acc);border-color:var(--acc)}
.F{color:var(--f)}
.w{color:var(--win)}.l{color:var(--loss)}
.seg{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.muted{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--in);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font:800 24px 'Barlow Condensed';color:var(--acc)}
.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase}
.match{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px;font-size:14px}
.match:last-child{border:0}
.match .sc{font:800 17px 'Barlow Condensed';min-width:58px;text-align:center}
.match .t{flex:1}.match .t.r{text-align:right}
.bold{font-weight:600}
a.lk{color:var(--txt);text-decoration:none;border-bottom:1px dotted var(--mut);cursor:pointer}
a.lk.F{color:var(--f)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
select,input,textarea{width:100%;background:var(--in);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:15px Inter}
textarea{min-height:120px;font:12px ui-monospace,monospace}
.btn{background:var(--acc);color:#111;border:0;border-radius:8px;padding:9px 14px;font:600 14px Inter;cursor:pointer}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.dng{background:none;color:var(--loss);border:1px solid #5a2a2a}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.admsw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);margin-top:8px}
.admsw input{width:auto}
ul.rules{padding-left:18px;margin:6px 0}ul.rules li{margin:4px 0}
.back{background:none;border:0;color:var(--acc);font:600 14px Inter;padding:0;cursor:pointer;margin-bottom:6px}
svg text{fill:var(--mut);font:11px Inter}
.mrow{border-bottom:1px solid var(--line);padding:10px 0}
.mrow:last-child{border:0}
.mrow .teams{display:grid;grid-template-columns:1fr 56px 14px 56px 1fr;gap:6px;align-items:center}
.mrow .teams input{text-align:center;font:800 18px 'Barlow Condensed';padding:6px 2px}
.mrow .meta{display:flex;gap:6px;margin-top:6px;align-items:center}
.mrow .meta input{width:80px;flex:none;padding:5px 8px;font-size:13px}
.mrow.done .teams input{border-color:#2a5d47}
.plist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.plist label{display:flex;gap:8px;align-items:center;margin:0;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--txt);font-size:14px}
.plist label input{width:auto}
.plist label.dis{opacity:.4}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:16px 16px 24px}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:16px}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a2f3a;color:var(--txt);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:60;max-width:90vw}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.bracket{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;min-width:168px;flex:1}
.bstack{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}
.bhead{font:800 14px 'Barlow Condensed';text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.bbox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bteam{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:13px}
.bteam+.bteam{border-top:1px solid var(--line)}

.sg-c small{display:block;margin-top:4px;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.ps{padding:2px 14px}
.ps-row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;column-gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:52px}
.ps-row:last-child{border:0}
.ps-ic{font-size:17px;text-align:center}
.ps-l{font-size:14px;color:#d9d2c9}
.ps-v{text-align:right;font-size:14px;font-weight:600;line-height:1.25}.ps-v a{border-bottom:0;color:#fff}
.ps-v small{display:block;color:var(--mut);font-size:11.5px;font-weight:400;margin-top:2px}
.ps-v b{font:700 18px Oswald,sans-serif}
.tmedal{margin-left:8px;font-size:18px;vertical-align:-1px;filter:drop-shadow(0 0 6px rgba(255,190,40,.5))}
.ti-i{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;border:1px solid currentColor;font:600 9px/1 Inter;font-style:normal;margin-left:5px;opacity:.55;vertical-align:1px;text-transform:none}
[data-tip]{cursor:help}
#tipbox{position:absolute;z-index:70;background:#2a2420;border:1px solid var(--acc);color:var(--txt);font-size:13px;line-height:1.4;padding:9px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.55);animation:tipin .12s ease-out}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grp-box{border:1px solid rgba(255,138,0,.45);border-radius:10px;padding:4px 10px 6px;background:rgba(255,138,0,.04);margin-top:4px}
.grp-box table tr:last-child td{border-bottom:0}
.grp-box-t{font:600 11px Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:1.4px;color:var(--acc2);padding:6px 0 2px}
.grp-sep{display:flex;align-items:center;gap:10px;margin:18px -14px 6px;padding:8px 14px;background:rgba(255,138,0,.07);border-top:1px solid rgba(255,138,0,.35);border-bottom:1px solid var(--line)}
.grp-sep span{font:600 12px Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:1.4px;color:var(--acc2)}
.lbmedal{margin-left:6px;font-size:14px;vertical-align:0}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;margin:4px 0 14px;border-bottom:2px solid rgba(255,190,90,.55)}
.pd-col{display:flex;flex-direction:column;align-items:stretch;text-align:center;cursor:pointer;min-width:0}
.pd-medal{font-size:30px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(255,180,40,.45))}
.pd-1 .pd-medal{font-size:40px}
.pd-step{border-radius:12px 12px 0 0;border:1px solid rgba(255,138,0,.5);border-bottom:0;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,rgba(255,138,0,.2),rgba(255,138,0,.03))}
.pd-1 .pd-step{min-height:128px;background:linear-gradient(180deg,rgba(255,207,63,.42),rgba(255,207,63,.05));border-color:#ffcf3f;box-shadow:0 -6px 24px rgba(255,200,60,.3)}
.pd-2 .pd-step{min-height:104px;background:linear-gradient(180deg,rgba(220,224,230,.32),rgba(220,224,230,.04));border-color:#cfd4da;box-shadow:0 -4px 16px rgba(220,224,230,.15)}
.pd-3 .pd-step{min-height:88px;background:linear-gradient(180deg,rgba(205,127,50,.4),rgba(205,127,50,.05));border-color:#cd7f32;box-shadow:0 -4px 16px rgba(205,127,50,.2)}
.pd-1 .pd-pts{color:#ffd66b}.pd-2 .pd-pts{color:#e2e5ea}.pd-3 .pd-pts{color:#e3a165}
.pd-pts .mv{font-size:11.5px}
.pd-name{font:700 16px/1.1 Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.3px;color:#fff;max-width:100%;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pd-1 .pd-name{font-size:20px}
.pd-pts{font:600 13px Inter,sans-serif;color:var(--acc2)}
.pd-mv{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:14px}
.pd-mv .mv{font-size:10.5px}
.nm{display:block;width:100%;text-align:left;margin:10px 0 0;padding:11px 14px;border-radius:12px;border:1px solid rgba(255,194,58,.55);background:linear-gradient(90deg,rgba(255,194,58,.13),rgba(255,138,0,.04));color:var(--txt);font:inherit}
.nm-ask{cursor:pointer;font-size:14px}.nm-ask b{color:var(--acc2)}
.nm-l{font-size:12px;color:var(--mut)}
.nm-m{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.nm-vs{font:700 17px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.3px}
.nm-when{font-size:14px;color:var(--acc2);font-weight:600}
.nm-chg{background:none;border:0;color:var(--acc2);font-size:12px;text-decoration:underline dotted;cursor:pointer;padding:0;margin-left:4px}
.tm-delay{display:block;background:none;border:0;color:var(--acc2);font:500 13px Inter;text-decoration:underline dotted;cursor:pointer;margin:8px 0 0;padding:0}
.undo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 12px;border-radius:10px;background:rgba(88,214,141,.1);border:1px solid rgba(88,214,141,.45);font-size:13px}
.undo .btn{flex:none}
.du-btn{margin:2px 0 4px}
.du-sel{align-items:center;margin-bottom:12px}
.du-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:14px 10px;border:1px solid rgba(255,138,0,.45)}
.du-head b{font:700 18px Oswald,sans-serif;text-transform:uppercase}
.du-big{font:700 44px/1 Oswald,sans-serif;background:var(--fire);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px}
.du-mid{font-size:12px;color:var(--mut);line-height:1.3;padding:0 6px}
.du{padding:4px 14px}
.du-r{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.du-r:last-child{border:0}
.du-r span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:0 8px;text-align:center}
.du-r b{font:600 17px Oswald,sans-serif;color:#d9d2c9}.du-r b:last-child{text-align:right}
.du-r b.du-hi{color:var(--acc2)}
.tro{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tro-c{background:var(--card);border:1px solid rgba(255,138,0,.35);border-radius:12px;padding:10px;cursor:pointer;text-align:center}
.tro-ic{font-size:24px;line-height:1}
.tro-t{font:500 11px Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:var(--acc2);margin-top:5px}
.tro-n{font:700 16px/1.15 Oswald,sans-serif;text-transform:uppercase;margin-top:4px;color:#fff}
.tro-v{font-size:12px;color:var(--mut);margin-top:2px}
.mc-title{margin-top:12px;color:var(--acc2);font:500 13px Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.4px}
.brand{cursor:pointer;-webkit-tap-highlight-color:transparent}
.brand:active .logo{transform:scale(.96)}
.rank.medal{background:none;color:inherit!important;font-size:20px}
</style>
</head>

/* =====================================================================

const expected=(fa,fb)=>1/(1+Math.pow(10,(fb-fa)/400));
function teamForce(roster,C){
  const r=roster.filter(id=>st[id]); if(!r.length) return C.mmrStart;
  const avg=r.reduce((a,id)=>a+st[id].mmr,0)/r.length;
  const nbF=r.filter(id=>players[id]?.g==="F").length;
  return avg-C.handicap*nbF/r.length;
}
/* S = résultat : 1 victoire, 0,5 match nul, 0 défaite. Les pertes (y compris un nul « décevant » pour le favori) sont réduites par le coefficient défaites. */
const ptsDelta=(E,S,C,M=1)=>{const raw=C.kPts*M*(+S-E);return Math.round(raw<0?raw*C.lossFactor:raw)};
const resOf=(me,op)=>me>op?1:me<op?0:.5;
const groupPts=r=>2*r.w+(r.n||0);   // victoire 2 pts, nul 1 pt, défaite 0
const rec=(w,n,l)=>n?`${w}V-${n}N-${l}D`:`${w}V-${l}D`;
const MARGIN_KEYS=[["close","Match serré"],["small","Petite victoire"],["normal","Écart normal"],["large","Large victoire"],["huge","Victoire écrasante"]];
function marginTiers(C=cfg()){const b=(Array.isArray(C.margin.limits)&&C.margin.limits.length===4?C.margin.limits:DEF.margin.limits);
  return MARGIN_KEYS.map(([k,l],i)=>{const lo=i?b[i-1]+1:1,hi=i<4?b[i]:Infinity;return [hi,k,l,hi===Infinity?`${lo}+ pts`:lo===hi?`${lo} pt${lo>1?"s":""}`:`${lo}-${hi} pts`]})}
function marginTier(diff,C){return marginTiers(C).find(([max])=>diff<=max)}
function marginMult(diff,C){if(!C.margin.on)return 1;return C.margin[marginTier(diff,C)[1]]}

function poolStandings(T,pool){
  const teams=(T.teams||[]).filter(t=>t.pool===pool);
  const rows=teams.map(t=>({t:t.id,w:0,n:0,l:0,pf:0,pa:0}));
  const by=Object.fromEntries(rows.map(r=>[r.t,r]));
  (T.matches||[]).filter(m=>m.stage==="pool"&&m.pool===pool&&scored(m)).forEach(m=>{
    const A=by[m.a],B=by[m.b]; if(!A||!B) return;
    A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++}else if(m.sb>m.sa){B.w++;A.l++}else{A.n++;B.n++}
  });
  rows.forEach(r=>r.d=r.pf-r.pa);
  return rows.sort((x,y)=>groupPts(y)-groupPts(x)||y.d-x.d||y.pf-x.pf);
}
function teamRecord(T,tid){
  let w=0,l=0,n=0,d=0;
  (T.matches||[]).filter(m=>scored(m)&&(m.a===tid||m.b===tid)).forEach(m=>{const me=m.a===tid?m.sa:m.sb,op=m.a===tid?m.sb:m.sa;me>op?w++:me<op?l++:n++;d+=me-op});
  return {w,l,n,d};
}
function bracketOutcome(T){
  const out={first:null,second:null,third:null,fourth:null,tier:{}};
  const bm=(T.matches||[]).filter(m=>m.stage==="bracket");
  bm.forEach(m=>{[m.a,m.b].forEach(t=>{if(out.tier[t]==null)out.tier[t]=6})});
  const lostIn={"1/8":6,"Quart":5,"Demi":3.5};
  bm.filter(scored).forEach(m=>{
    const W=m.sa>m.sb?m.a:m.b, L=m.sa>m.sb?m.b:m.a;
    if(m.round==="Finale"){out.first=W;out.second=L;out.tier[W]=1;out.tier[L]=2}
    else if(m.round==="Petite finale"){out.third=W;out.fourth=L;out.tier[W]=3;out.tier[L]=4}
    else if(lostIn[m.round]!=null&&out.tier[L]>=lostIn[m.round]) out.tier[L]=Math.min(out.tier[L],lostIn[m.round]);
  });
  return out;
}
function tournamentRanking(T){
  const bo=bracketOutcome(T);
  const rows=(T.teams||[]).map(t=>({team:t,tier:bo.tier[t.id]??7,...teamRecord(T,t.id)}));
  rows.sort((a,b)=>a.tier-b.tier||groupPts(b)-groupPts(a)||b.d-a.d);
  rows.forEach((r,i)=>r.place=i+1);
  return {rows,bo};
}
function tournamentBonus(T,C){
  const B={}; (T.teams||[]).forEach(t=>B[t.id]=0);
  const bm=(T.matches||[]).filter(m=>m.stage==="bracket");
  const hasGroup=(T.matches||[]).some(m=>m.stage==="pool"||m.stage==="swiss");
  if(hasGroup){const q=new Set();bm.forEach(m=>{q.add(m.a);q.add(m.b)});q.forEach(t=>{if(t in B)B[t]+=C.bonus.pool})}
  bm.filter(scored).forEach(m=>{const W=m.sa>m.sb?m.a:m.b;
    if(m.round==="Quart"||m.round==="1/8")B[W]+=C.bonus.quarter;
    if(m.round==="Demi")B[W]+=C.bonus.semi;});
  const bo=bracketOutcome(T);
  if(bo.first)B[bo.first]+=C.bonus.first;
  if(bo.second)B[bo.second]+=C.bonus.second;
  if(bo.third)B[bo.third]+=C.bonus.third;
  return B;
}
const seasonOrder=C=>{const past=(C.pastSeasons||[]).filter(s=>s!==C.season);return [...past,C.season]};
const seasonOf=(T,C)=>T.season||C.season;
const sortedTournaments=()=>{const C=cfg(),ord=seasonOrder(C);const si=T=>{const i=ord.indexOf(seasonOf(T,C));return i<0?ord.length-1:i};
  return Object.entries(tournaments).map(([id,t])=>({...t,id})).sort((a,b)=>si(a)-si(b)||(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0))};

function compute(Cin){
  const C=Cin||cfg(); st={}; RES={}; SEASONS={}; RANKMOVE={}; MOVE_T=null; MOVE_TID=null;
  let snaps=[];
  const rankSnap=()=>{const r={};["H","F"].forEach(g=>Object.keys(st).filter(id=>players[id]?.g===g&&st[id].games>0).sort((a,b)=>st[b].pts-st[a].pts||st[b].wins-st[a].wins).forEach((id,i)=>r[id]=i+1));return r};
  for(const id in players) st[id]={mmr:C.mmrStart,pts:0,games:0,wins:0,gamesAll:0,tourn:0,hist:[{label:"Départ",pts:0}],log:[],byT:{},podiums:[0,0,0],past:{}};
  let curS=null;
  const closeSeason=S=>{
    const rows={}; for(const id in st){const s=st[id]; if(s.games>0) rows[id]={pts:s.pts,games:s.games,wins:s.wins,draws:s.draws||0,tourn:s.tourn,podiums:[...s.podiums]}}
    ["H","F"].forEach(g=>Object.keys(rows).filter(id=>players[id]?.g===g).sort((a,b)=>rows[b].pts-rows[a].pts||rows[b].wins-rows[a].wins).forEach((id,i)=>rows[id].rank=i+1));
    SEASONS[S]={rows}; snaps=[];
    for(const id in st){const s=st[id]; if(rows[id]) s.past[S]=rows[id];
      s.pts=0;s.games=0;s.wins=0;s.draws=0;s.tourn=0;s.podiums=[0,0,0];s.hist=[{label:"Départ",pts:0}];
      s.mmr=C.mmrStart+(s.mmr-C.mmrStart)*(C.compress??0.5)}
  };
  for(const T of sortedTournaments()){
    const S=seasonOf(T,C); if(curS!==null&&S!==curS) closeSeason(curS); curS=S;
    const teams=Object.fromEntries((T.teams||[]).map(t=>[t.id,t]));
    const res={matchInfo:{},bonus:{},ranking:null,season:S}; RES[T.id]=res;
    const anyScore=(T.matches||[]).some(scored);
    if(T.status==="planned"&&!anyScore){res.ranking=tournamentRanking(T);continue}
    const involved=new Set();
    (T.teams||[]).forEach(t=>t.roster.forEach(pid=>{if(st[pid]){involved.add(pid);st[pid].byT[T.id]={team:t.id,season:S,before:st[pid].pts,match:0,part:0,bonus:0,total:0,games:0}}}));
    if(T.status!=="planned"&&T.kind!=="session") involved.forEach(pid=>{st[pid].pts+=C.participation;st[pid].byT[T.id].part=C.participation});
    (T.matches||[]).forEach(m=>{
      if(!scored(m)) return; const A=teams[m.a],B=teams[m.b]; if(!A||!B) return;
      const fA=teamForce(A.roster,C),fB=teamForce(B.roster,C),EA=expected(fA,fB),SA=resOf(m.sa,m.sb);
      const gap=Math.abs(m.sa-m.sb), M=gap===0?(C.margin.on?C.margin.normal:1):marginMult(gap,C);
      const info=res.matchInfo[m.id]={EA,dA:0,dB:0,fA,fB,M,gap,pl:{}};
      const w=Math.min(1,Math.max(0,C.indiv??0.5));
      const eff=pid=>st[pid].mmr-(players[pid]?.g==="F"?C.handicap:0);
      const upd=(team,opp,fT,fO,S,me,op,key)=>{const won=S===1,ds=[];team.roster.forEach(pid=>{
        const s=st[pid]; if(!s) return;
        const E=expected(w*eff(pid)+(1-w)*fT,fO), d=ptsDelta(E,S,C,M); ds.push(d);
        const K=s.gamesAll<C.newGames?C.kNew:C.k, dm=K*M*(S-E);
        s.mmr+=dm; s.games++; s.gamesAll++; if(won)s.wins++; if(S===.5)s.draws=(s.draws||0)+1;
        const before=s.pts; s.pts=Math.max(0,s.pts+d);
        const real=s.pts-before; s.byT[T.id].match+=real; s.byT[T.id].games++; info.pl[pid]={d:real,dm,E};
        s.log.push({tid:T.id,mid:m.id,round:m.round,opp:opp.name,me,op,won,res:S,d:real,E,dm});
      });if(ds.length)info[key]=Math.round(ds.reduce((a,b)=>a+b,0)/ds.length)};
      upd(A,B,fA,fB,SA,m.sa,m.sb,"dA"); upd(B,A,fB,fA,1-SA,m.sb,m.sa,"dB");
    });
    res.ranking=tournamentRanking(T);
    if(T.status==="done"&&T.kind!=="session"){
      res.bonus=tournamentBonus(T,C);
      (T.teams||[]).forEach(t=>t.roster.forEach(pid=>{const s=st[pid];if(!s)return;s.pts+=res.bonus[t.id];s.byT[T.id].bonus=res.bonus[t.id]}));
      const bo=res.ranking.bo;[bo.first,bo.second,bo.third].forEach((tid,i)=>{if(tid&&teams[tid])teams[tid].roster.forEach(pid=>st[pid]&&st[pid].podiums[i]++)});
    }
    res.ranking.rows.forEach(r=>r.team.roster.forEach(pid=>{if(st[pid]?.byT[T.id])st[pid].byT[T.id].place=r.place}));
    involved.forEach(pid=>{const s=st[pid],b=s.byT[T.id];b.total=s.pts-b.before;if(b.games>0&&T.kind!=="session")s.tourn++;s.hist.push({label:T.name,pts:s.pts,tid:T.id})});
    if(T.status==="done"&&T.kind!=="session") snaps.push({tid:T.id,name:T.name,r:rankSnap()});
  }
  if(curS!==null&&curS!==C.season) closeSeason(curS);
  if(snaps.length){const last=snaps[snaps.length-1],prev=snaps.length>1?snaps[snaps.length-2].r:null;MOVE_T=last.name;MOVE_TID=last.tid;
    for(const id in last.r) RANKMOVE[id]=prev?(prev[id]?prev[id]-last.r[id]:"new"):null;}
}

/* =====================================================================
   GÉNÉRATION DES MATCHS (poules, phase finale)
   ===================================================================== */
const poolLetters=n=>"ABCDEFGH".slice(0,n).split("");
function autoPools(T){
  const C=cfg(), letters=poolLetters(T.pools||1);
  const ranked=[...T.teams].sort((a,b)=>teamForce(b.roster,C)-teamForce(a.roster,C));
  ranked.forEach((t,i)=>{const r=Math.floor(i/letters.length),c=i%letters.length;t.pool=letters[r%2?letters.length-1-c:c]});
  return T;
}
function roundRobin(ids){
  const a=[...ids]; if(a.length%2)a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pairs.push(r%2?[y,x]:[x,y])}rounds.push(pairs);a.splice(1,0,a.pop())}
  return rounds;
}
function genPoolMatches(T){
  const before=new Set((T.matches||[]).map(m=>m.id));
  if((T.matches||[]).some(m=>m.stage==="pool"&&scored(m))) return "Des scores de poule existent déjà : impossible de régénérer.";
  if((T.teams||[]).some(t=>!t.pool)) autoPools(T);
  const letters=poolLetters(T.pools||1), byPool=letters.map(p=>roundRobin(T.teams.filter(t=>t.pool===p).map(t=>t.id)));
  const out=[], maxR=Math.max(0,...byPool.map(r=>r.length));
  for(let r=0;r<maxR;r++) byPool.forEach((rounds,pi)=>(rounds[r]||[]).forEach(([a,b])=>out.push({id:uid(),stage:"pool",pool:letters[pi],round:"Poule "+letters[pi],a,b,sa:null,sb:null,time:"",court:""})));
  T.matches=[...out,...(T.matches||[]).filter(m=>m.stage!=="pool")];
  schedule(T,newIds(T,before));
  return null;
}
function seedOrder(n){let a=[1,2];while(a.length<n){const L=a.length*2;a=a.flatMap(s=>[s,L+1-s])}return a}
const fmtOf=T=>T.format||"pools";
const bracketSize=T=>T.bracketSize||((T.pools||1)*(T.qualifiers||2));
const isGroup=m=>m.stage==="pool"||m.stage==="swiss";
function swissStandings(T){
  const rows=(T.teams||[]).map(t=>({t:t.id,w:0,n:0,l:0,pf:0,pa:0,byes:0,opps:[]}));
  const by=Object.fromEntries(rows.map(r=>[r.t,r]));
  (T.matches||[]).filter(m=>m.stage==="swiss").forEach(m=>{
    if(m.bye){if(by[m.a]){by[m.a].w++;by[m.a].byes++}return}
    const A=by[m.a],B=by[m.b]; if(!A||!B||!scored(m)) return;
    A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;A.opps.push(B.t);B.opps.push(A.t);
    if(m.sa>m.sb){A.w++;B.l++}else if(m.sb>m.sa){B.w++;A.l++}else{A.n++;B.n++}
  });
  rows.forEach(r=>{r.d=r.pf-r.pa;r.bh=r.opps.reduce((a,o)=>a+groupPts(by[o]),0)});
  return rows.sort((x,y)=>groupPts(y)-groupPts(x)||y.bh-x.bh||y.d-x.d||y.pf-x.pf);
}
const swissRoundsDone=T=>Math.max(0,...(T.matches||[]).filter(m=>m.stage==="swiss").map(m=>m.rnum||0));
function genSwissRound(T){
  const sw=(T.matches||[]).filter(m=>m.stage==="swiss"), cur=swissRoundsDone(T);
  if(cur>=(T.swissRounds||3)) return "Toutes les rondes ont été générées.";
  if(sw.some(m=>!m.bye&&!scored(m))) return "Tous les matchs de la ronde en cours doivent avoir un score.";
  if((T.teams||[]).length<2) return "Il faut au moins 2 équipes.";
  const r=cur+1, C=cfg(), played=new Set(sw.filter(m=>!m.bye).map(m=>[m.a,m.b].sort().join("|")));
  const pl=(a,b)=>played.has([a,b].sort().join("|"));
  let order, byeTeam=null;
  if(r===1) order=[...T.teams].sort((a,b)=>teamForce(b.roster,C)-teamForce(a.roster,C)).map(t=>t.id);
  else order=swissStandings(T).map(x=>x.t);
  if(order.length%2){
    const s=r===1?null:Object.fromEntries(swissStandings(T).map(x=>[x.t,x]));
    for(let i=order.length-1;i>=0;i--){if(!s||!s[order[i]].byes){byeTeam=order[i];break}}
    if(!byeTeam) byeTeam=order[order.length-1];
    order=order.filter(t=>t!==byeTeam);
  }
  let pairs;
  if(r===1){const h=order.length/2;pairs=order.slice(0,h).map((t,i)=>[t,order[h+i]])}
  else{
    const bt=list=>{if(!list.length)return[];const [x,...rest]=list;for(let i=0;i<rest.length;i++){if(pl(x,rest[i]))continue;const sub=bt(rest.filter((_,j)=>j!==i));if(sub)return[[x,rest[i]],...sub]}return null};
    pairs=bt(order); if(!pairs){pairs=[];for(let i=0;i<order.length;i+=2)pairs.push([order[i],order[i+1]])}
  }
  T.matches=T.matches||[];
  pairs.forEach(([a,b])=>T.matches.push({id:uid(),stage:"swiss",rnum:r,round:"Ronde "+r,a,b,sa:null,sb:null,time:"",court:""}));
  if(byeTeam) T.matches.push({id:uid(),stage:"swiss",rnum:r,round:"Ronde "+r,a:byeTeam,b:null,bye:true,sa:null,sb:null});
  schedule(T,new Set(T.matches.filter(m=>m.stage==="swiss"&&m.rnum===r).map(m=>m.id)));
  return null;
}
function seedList(T){
  const B=bracketSize(T);
  if(fmtOf(T)==="swiss") return swissStandings(T).slice(0,B).map((r,i)=>({t:r.t,pool:null,lvl:i}));
  const letters=poolLetters(T.pools||1), st=Object.fromEntries(letters.map(p=>[p,poolStandings(T,p)]));
  const seeds=[]; const per=Math.floor(B/letters.length);
  for(let pos=0;seeds.length<B;pos++){
    const lvl=letters.map(p=>st[p][pos]&&{...st[p][pos],pool:p}).filter(Boolean).sort((x,y)=>groupPts(y)-groupPts(x)||y.d-x.d||y.pf-x.pf);
    if(!lvl.length) break;
    const take=pos<per?lvl:lvl.slice(0,B-seeds.length);
    take.forEach(r=>seeds.push({t:r.t,pool:r.pool,lvl:pos}));
  }
  return seeds.slice(0,B);
}
function genBracket(T){
  const gm=(T.matches||[]).filter(m=>isGroup(m)&&!m.bye);
  if(!gm.length) return "Aucun match de phase de groupes.";
  if(gm.some(m=>!scored(m))) return "Tous les matchs de la phase de groupes doivent avoir un score.";
  if(fmtOf(T)==="swiss"&&swissRoundsDone(T)<(T.swissRounds||3)) return "Toutes les rondes suisses ne sont pas encore jouées.";
  if((T.matches||[]).some(m=>m.stage==="bracket")) return "La phase finale existe déjà.";
  const B=bracketSize(T); if(!ROUND_BY_SIZE[B]) return "Taille de phase finale invalide.";
  const seeds=seedList(T); if(seeds.length<B) return `Pas assez d'équipes (${seeds.length}) pour une phase finale à ${B}.`;
  const order=seedOrder(B), pairs=[];
  for(let i=0;i<B;i+=2) pairs.push([seeds[order[i]-1],seeds[order[i+1]-1]]);
  // éviter deux équipes de la même poule au premier tour
  for(let i=0;i<pairs.length;i++){
    if(!pairs[i][0].pool||pairs[i][0].pool!==pairs[i][1].pool) continue;
    const ok=(j,same)=>j!==i&&pairs[j][1].pool!==pairs[i][0].pool&&pairs[j][0].pool!==pairs[i][1].pool&&(!same||pairs[j][1].lvl===pairs[i][1].lvl);
    let j=pairs.findIndex((_,k)=>ok(k,true)); if(j<0) j=pairs.findIndex((_,k)=>ok(k,false));
    if(j>=0){const tmp=pairs[i][1];pairs[i][1]=pairs[j][1];pairs[j][1]=tmp}
  }
  const round=ROUND_BY_SIZE[B];
  const before=new Set(T.matches.map(m=>m.id));
  pairs.forEach(([a,b],i)=>T.matches.push({id:uid(),stage:"bracket",round,slot:i,a:a.t,b:b.t,sa:null,sb:null,time:"",court:""}));
  schedule(T,newIds(T,before));
  return null;
}
function currentBracketRound(T){
  const rs=[...new Set((T.matches||[]).filter(m=>m.stage==="bracket"&&m.round!=="Petite finale").map(m=>m.round))];
  return rs.sort((a,b)=>ROUND_ORDER.indexOf(a)-ROUND_ORDER.indexOf(b)).pop()||null;
}
function genNextRound(T){
  const cur=currentBracketRound(T); if(!cur) return "Pas de phase finale.";
  if(cur==="Finale") return "La finale est déjà programmée.";
  const ms=T.matches.filter(m=>m.stage==="bracket"&&m.round===cur).sort((a,b)=>a.slot-b.slot);
  if(ms.some(m=>!scored(m))) return `Tous les matchs « ${cur} » doivent avoir un score.`;
  const W=ms.map(m=>m.sa>m.sb?m.a:m.b), L=ms.map(m=>m.sa>m.sb?m.b:m.a);
  const next=ROUND_BY_SIZE[W.length], before=new Set(T.matches.map(m=>m.id));
  for(let i=0;i<W.length;i+=2) T.matches.push({id:uid(),stage:"bracket",round:next,slot:i/2,a:W[i],b:W[i+1],sa:null,sb:null,time:"",court:""});
  if(cur==="Demi") T.matches.push({id:uid(),stage:"bracket",round:"Petite finale",slot:0,a:L[0],b:L[1],sa:null,sb:null,time:"",court:""});
  schedule(T,newIds(T,before));
  return null;
}

/* ---------- Planning : terrains & horaires ---------- */
const hm2min=v=>{const m=/^(\d{1,2})[:h](\d{2})$/.exec(String(v||"").trim());return m?+m[1]*60+ +m[2]:null};
const min2hm=n=>`${String(Math.floor(n/60)%24).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
const fmtH=v=>v?String(v).replace(":","h"):"";
const nCourts=T=>Math.max(1,+T.courts||(fmtOf(T)==="pools"?(T.pools||1):2));
const slotMin=T=>Math.max(1,+(T.slotMinutes??T.matchMinutes??10));
/* Attribue un terrain (et un horaire si l'heure du 1er match est connue) aux matchs « ids ».
   Poules : chaque poule garde son terrain. Autres tours : répartis sur les terrains, après la fin du tour précédent. */
function schedule(T,ids){
  const N=nCourts(T), step=slotMin(T), start=hm2min(T.startTime), letters=poolLetters(T.pools||1);
  const free={}; for(let c=1;c<=N;c++) free[c]=start??0;
  (T.matches||[]).forEach(m=>{if(ids.has(m.id)||m.bye)return;const c=+m.court,t=hm2min(m.time);if(c>=1&&c<=N&&t!=null)free[c]=Math.max(free[c],t+step)});
  let block=null;
  (T.matches||[]).filter(m=>ids.has(m.id)&&!m.bye).forEach(m=>{
    let c;
    if(m.stage==="pool"){c=(Math.max(0,letters.indexOf(m.pool))%N)+1}
    else{
      const key=m.stage+"|"+(m.round==="Petite finale"?"Finale":m.round)+"|"+(m.rnum||"");
      if(key!==block){block=key;const mx=Math.max(...Object.values(free));for(const k in free)free[k]=mx}
      c=+Object.keys(free).sort((a,b)=>free[a]-free[b]||a-b)[0];
    }
    m.court=String(c);
    if(start!=null){m.time=min2hm(free[c]);free[c]+=step}
  });
}
const newIds=(T,before)=>new Set((T.matches||[]).filter(m=>!before.has(m.id)).map(m=>m.id));
async function replanAll(tid){
  const T=getT(tid), ids=new Set(T.matches.filter(m=>!m.bye&&!scored(m)).map(m=>m.id));
  if(!ids.size) return 0;
  T.matches.forEach(m=>{if(ids.has(m.id)){m.court="";m.time=""}});
  schedule(T,ids);
  const jobs=[saveT(T)];
  T.matches.forEach(m=>{const k=tid+"-"+m.id;if(ids.has(m.id)&&scoresMap[k])jobs.push(saveScore(tid,m.id,{...scoresMap[k],time:m.time||"",court:m.court||""}))});
  await Promise.all(jobs); return ids.size;
}
async function doReplan(tid){
  const T=tournaments[tid], n=(T.matches||[]).filter(m=>!m.bye&&!scored(m)).length;
  if(!n) return toast("Aucun match à planifier");
  if(!await ask(`Réattribuer terrains${T.startTime?" et horaires":""} des ${n} match(s) non joué(s) ? (${nCourts(T)} terrain(s)${T.startTime?`, 1er match ${fmtH(T.startTime)}, un match toutes les ${slotMin(T)} min`:""})`)) return;
  await replanAll(tid); toast("Planning mis à jour");
}

   ÉCRITURES (une à la fois par document)
   ===================================================================== */
const chains={};
function write(path,fn){
  if(!DB){toast("Base de données indisponible");return Promise.resolve(false)}
  chains[path]=(chains[path]||Promise.resolve()).then(fn).then(()=>true).catch(e=>{
    toast(e?.code==="invalid_argument"||e?.code==="permission-denied"?"Écriture refusée (droits insuffisants ?)":e?.code==="quota_exceeded"?"Quota de stockage atteint":"Erreur : "+(e?.code||e?.message||e));return false});
  return chains[path];
}
/* Les scores sont stockés à part (un document par match) : deux admins peuvent saisir en même temps sans s'écraser. */
function mergeAll(){
  tournaments={};
  for(const id in tRaw){const T=clone(tRaw[id]);
    (T.matches||[]).forEach(m=>{const s=scoresMap[id+"-"+m.id];if(s){m.sa=Number.isFinite(s.sa)?s.sa:null;m.sb=Number.isFinite(s.sb)?s.sb:null;if(s.time!=null)m.time=s.time;if(Array.isArray(s.ev))m.ev=s.ev;if(s.court!=null)m.court=s.court}});
    if(T.status==="planned"&&(T.matches||[]).some(scored)) T.status="live";
    tournaments[id]=T}
}
const saveT=(T,keepEv)=>{const {id,...body}=T;if(!keepEv)(body.matches||[]).forEach(m=>{delete m.ev});tRaw[id]=body;mergeAll();scheduleRender();return write("tournaments/"+id,()=>DB.doc("tournaments/"+id).set(body))};
const saveScore=(tid,mid,data)=>{const k=tid+"-"+mid;scoresMap[k]=data;mergeAll();scheduleRender();return write("scores/"+k,()=>DB.doc("scores/"+k).set(data))};
const saveP=(id,p)=>{players[id]=p;scheduleRender();return write("players/"+id,()=>DB.doc("players/"+id).set(p))};
const delDoc=path=>write(path,()=>DB.doc(path).delete());
const getT=id=>({...clone(tournaments[id]),id});
function forgetTournament(id){delete tRaw[id];const ks=Object.keys(scoresMap).filter(k=>k.startsWith(id+"-"));ks.forEach(k=>delete scoresMap[k]);mergeAll();return ks}
/* Tournoi terminé : on range les scores dans le document du tournoi et on supprime les documents de score (moins de lectures pour les visiteurs). */
async function archiveTournament(id){
  const T=getT(id), ks=Object.keys(scoresMap).filter(k=>k.startsWith(id+"-"));
  if(!ks.length) return;
  await saveT(T,true);
  ks.forEach(k=>delete scoresMap[k]); mergeAll();
  for(const k of ks) await delDoc("scores/"+k);
}
async function deleteTournamentDocs(id){const ks=forgetTournament(id);scheduleRender();await delDoc("tournaments/"+id);for(const k of ks) await delDoc("scores/"+k)}

/* Recalcule le tableau final à partir des résultats (après correction d'un score). */
function rebuildBracket(T){
  const bm=T.matches.filter(m=>m.stage==="bracket");
  const rounds=ROUND_ORDER.filter(r=>r!=="Petite finale"&&bm.some(m=>m.round===r));
  const win=m=>m&&scored(m)?(m.sa>m.sb?m.a:m.b):null, lose=m=>m&&scored(m)?(m.sa>m.sb?m.b:m.a):null;
  const cleared=[]; let changed=false;
  const fix=(m,na,nb)=>{
    if(na===null||nb===null){if(scored(m)){m.sa=null;m.sb=null;cleared.push(m.id)}return}
    if(na!==m.a||nb!==m.b){m.a=na;m.b=nb;changed=true;if(scored(m)){m.sa=null;m.sb=null;cleared.push(m.id)}}
  };
  for(let i=1;i<rounds.length;i++){
    const prev=bm.filter(m=>m.round===rounds[i-1]).sort((a,b)=>a.slot-b.slot);
    bm.filter(m=>m.round===rounds[i]).forEach(m=>fix(m,win(prev[2*m.slot]),win(prev[2*m.slot+1])));
  }
  const demis=bm.filter(m=>m.round==="Demi").sort((a,b)=>a.slot-b.slot), pf=bm.find(m=>m.round==="Petite finale");
  if(pf&&demis.length===2) fix(pf,lose(demis[0]),lose(demis[1]));
  return {changed,cleared};
}
async function commitScore(tid,mid,a,b,time,court,ev){
  const T=getT(tid), m=T.matches.find(x=>x.id===mid); if(!m) return false;
  m.sa=a;m.sb=b; if(time!=null)m.time=time; if(court!=null)m.court=court;
  let structural=false, cleared=[];
  if(m.stage==="bracket"){
    const r=rebuildBracket(T); cleared=r.cleared; structural=r.changed||cleared.length>0;
    if(structural&&!await ask(`Ce score change le vainqueur : le tableau est mis à jour automatiquement${cleared.length?` et ${cleared.length} score(s) déjà saisi(s) au tour suivant seront effacés (à ressaisir)`:""}. Continuer ?`)) return false;
  }
  if(T.status==="planned"&&scored(m)){T.status="live";structural=true}
  const prevEv=scoresMap[tid+"-"+mid]?.ev, evs=ev||(a==null?null:prevEv), data={sa:a,sb:b,time:m.time||"",court:m.court||"",at:Date.now()};
  if(evs&&evs.length) data.ev=evs;
  const now=Date.now(), jobs=[saveScore(tid,mid,data)];
  cleared.forEach(cid=>{const cm=T.matches.find(x=>x.id===cid);jobs.push(saveScore(tid,cid,{sa:null,sb:null,time:cm.time||"",court:cm.court||"",at:now}))});
  if(structural) jobs.push(saveT(T));
  const ok=await Promise.all(jobs); return ok.every(Boolean);
}

function parseHash(){
  const h=location.hash.slice(1);let m;
  if(h==="classement-f") return {v:"classement",g:"F"};
  if(h==="tournois") return {v:"tournois"};
  if(m=h.match(/^t-([a-z0-9]+)(?:-([a-z]+))?$/)) return {v:"tournoi",id:m[1],tab:m[2]||null};
  if(m=h.match(/^j-([a-z0-9]+)$/)) return {v:"joueur",id:m[1]};
  if(["simulateur","reglement","joueurs","reglages","donnees","table","calibrage","visuels","acces","admin","session","duel"].includes(h)) return {v:h};
  return {v:"classement",g:"H"};
}

}

  return `<div class="podium">${step(top[1],2)}${step(top[0],1)}${step(top[2],3)}</div>`;
}

/* ---------- Statistiques individuelles (carrière) ---------- */
function playerStats(pid){
  const out={g:0,w:0,n:0,l:0,pf:0,pa:0,opp:{},mate:{},big:null,close:{w:0,n:0,l:0},cur:0,best:0,curType:null,stage:{groupe:{w:0,g:0},finale:{w:0,g:0},session:{w:0,g:0}},bestT:null};
  let streak=0;
  for(const T of sortedTournaments()){
    const R=RES[T.id]; if(!R) continue;
    for(const m of (T.matches||[])){
      if(!scored(m)||!R.matchInfo[m.id]) continue;
      const A=teamOf(T,m.a),B=teamOf(T,m.b); if(!A||!B) continue;
      const inA=A.roster.includes(pid), inB=B.roster.includes(pid); if(!inA&&!inB) continue;
      const me=inA?m.sa:m.sb, op=inA?m.sb:m.sa, mine=inA?A:B, them=inA?B:A, d=me-op, r=d>0?"w":d<0?"l":"n";
      out.g++; out[r]++; out.pf+=me; out.pa+=op;
      if(r==="w"){streak=streak>0?streak+1:1}else if(r==="l"){streak=streak<0?streak-1:-1}else streak=0;
      if(streak>out.best) out.best=streak;
      if(Math.abs(d)<=2){out.close[r]++}
      if(d>0&&(!out.big||d>out.big.d)) out.big={d,me,op,opp:them.name,tid:T.id,mid:m.id};
      const st_=m.stage==="bracket"?"finale":m.stage==="session"?"session":"groupe"; out.stage[st_].g++; if(r==="w")out.stage[st_].w++;
      them.roster.forEach(o=>{if(!players[o])return;const x=out.opp[o]||(out.opp[o]={g:0,d:0,w:0,l:0,n:0});x.g++;x.d+=d;x[r]++});
      mine.roster.forEach(o=>{if(o===pid||!players[o])return;const x=out.mate[o]||(out.mate[o]={g:0,d:0,w:0});x.g++;x.d+=d;if(r==="w")x.w++});
    }
    const b=st[pid]?.byT?.[T.id]; if(b&&!isSession(T)&&(!out.bestT||b.total>out.bestT.total)) out.bestT={tid:T.id,name:T.name,total:b.total,place:b.place};
  }
  out.cur=streak;
  const pick=(obj,score,min=2)=>{let e=Object.entries(obj);const f=e.filter(([,x])=>x.g>=min);if(f.length)e=f;e.sort((a,b)=>score(b[1])-score(a[1])||b[1].g-a[1].g);return e[0]||null};
  out.nemesis=pick(out.opp,x=>-x.d); if(out.nemesis&&out.nemesis[1].d>=0) out.nemesis=null;
  out.victim=pick(out.opp,x=>x.d); if(out.victim&&out.victim[1].d<=0) out.victim=null;
  out.rival=pick(out.opp,x=>x.g,1);
  out.duo=pick(out.mate,x=>x.w/x.g*100+x.d/100); 
  return out;
}
function playerStatsHTML(pid){

  const diff=S.pf-S.pa;
  const TIPS={"Matchs":"Nombre total de matchs joués, en tournoi et en session.","Victoires":"Part des matchs gagnés sur tous les matchs joués.","+/- total":"Points marqués moins points encaissés par son équipe, additionnés sur tous ses matchs.","Moy. off":"Moyenne de points marqués par son équipe à chaque match.","Moy. déf":"Moyenne de points encaissés par son équipe à chaque match : plus c'est bas, mieux c'est.","Moy. +/-":"Écart moyen au score par match : positif, il gagne en moyenne ses matchs de ce nombre de points.",
    "Némésis":"L'adversaire contre qui il a perdu le plus de points au total.","Rival":"L'adversaire qu'il a affronté le plus souvent.","Meilleur coéquipier":"Le partenaire avec qui il a le meilleur pourcentage de victoires.","Série en cours":"Nombre de victoires (V) ou de défaites (D) d'affilée sur ses derniers matchs.","Matchs serrés":"Son bilan dans les matchs finis avec 2 points d'écart ou moins.","Plus large victoire":"Le match qu'il a gagné avec le plus gros écart.","Meilleur tournoi":"Le tournoi où il a gagné le plus de points au classement.","Victoires par phase":"Son pourcentage de victoires en phase de groupes, en phase finale et en session."};

  return `<div class="ps-sec">Statistiques <span>carrière</span></div>
  <div class="card sg">
    ${cell(S.g,"Matchs")}${cell(pct(S.w,S.g),"Victoires")}${cell(pm(diff),"+/- total",diff<0?"neg":"")}
    ${cell(dec(S.pf/S.g),"Moy. off")}${cell(dec(S.pa/S.g),"Moy. déf")}${cell(pm(+dec(diff/S.g).replace(",",".")).replace(".",","),"Moy. +/-",diff<0?"neg":"")}
  </div>
  <div class="ps-sec">Face à face</div>
  <div class="card ps">
    ${row("😈","Némésis",n[0],n[1]+(S.nemesis?` · <a class="lk" onclick="openDuel('${pid}','${S.nemesis[0]}')">face-à-face</a>`:""))}
    ${row("⚔️","Rival",r[0],r[1]+(S.rival?` · <a class="lk" onclick="openDuel('${pid}','${S.rival[0]}')">face-à-face</a>`:""))}
    ${row("🤝","Meilleur coéquipier",d[0],d[1])}
  </div>
  <div class="ps-sec">Records & forme</div>
  <div class="card ps">
    ${row("🔥","Série en cours",streak,`record : ${S.best} V d'affilée`)}
    ${row("🧊","Matchs serrés",`<b>${rec(S.close.w,S.close.n,S.close.l)}</b>`,"écart ≤ 2 pts")}
    ${S.big?row("💥","Plus large victoire",`<b class="w">${S.big.me}-${S.big.op}</b>`,`vs ${esc(S.big.opp)}`,`openMatch('${S.big.tid}','${S.big.mid}')`):""}
    ${S.bestT?row("⭐","Meilleur tournoi",`<b class="w">+${S.bestT.total}</b>`,`${esc(S.bestT.name.replace(/\s*\(démo\)/i,""))}${S.bestT.place?` · ${S.bestT.place}${S.bestT.place===1?"er":"e"}`:""}`,`go({v:'tournoi',id:'${S.bestT.tid}'})`):""}
    ${phases?row("🏆","Victoires par phase","",phases):""}
  </div>
  <div class="ps-sec">Tournois de la saison</div>`;
}

function fmtHint(){
  const f=document.getElementById("tF").value,p=+document.getElementById("tP").value,s=+document.getElementById("tS").value,B=+document.getElementById("tB").value;
  document.getElementById("wP").style.display=f==="pools"?"":"none";document.getElementById("wS").style.display=f==="swiss"?"":"none";

  if(f==="swiss") h=`${s} rondes : chaque équipe joue ${s} matchs contre des adversaires de même bilan, sans revoir le même adversaire. Les ${B} premiers vont en ${B===8?"quarts":"demies"}.`;
  else{const q=Math.floor(B/p),x=B-q*p;h=`${p} poule(s) → ${q} qualifié(s) par poule${x?` + ${x} meilleur(s) ${q+1}e(s)`:""} → ${B===8?"quarts":"demies"}.${q<1?' <span class="l">Trop de poules pour cette phase finale.</span>':""}`}
  document.getElementById("bh").innerHTML=h;
}
async function saveTournamentForm(id){
  const name=document.getElementById("tN").value.trim(); if(!name) return toast("Nom requis");
  const format=document.getElementById("tF").value,pools=+document.getElementById("tP").value,swissRounds=+document.getElementById("tS").value,B=+document.getElementById("tB").value;
  if(format==="pools"&&B<pools) return toast("Trop de poules pour cette phase finale");
  const base=id?getT(id):{id:uid(),status:"planned",season:cfg().season,teams:[],matches:[],createdAt:Date.now()};
  const started=(base.matches||[]).some(isGroup);
  const planKey=T=>[T.startTime||"",nCourts(T),slotMin(T)].join("|"), oldPlan=id?planKey(base):null;
  Object.assign(base,{meetTime:document.getElementById("tRv").value,startTime:document.getElementById("tSt").value,courts:+document.getElementById("tC").value,slotMinutes:Math.max(1,+document.getElementById("tSlot").value||10)});
  Object.assign(base,{name,date:document.getElementById("tD").value,place:document.getElementById("tL").value.trim(),bracketSize:B,
    matchMinutes:Math.max(1,+document.getElementById("tMm").value||10),finalMinutes:Math.max(1,+document.getElementById("tMf").value||10),scoreLimit:Math.max(5,+document.getElementById("tSl").value||21)});
  if(!started) Object.assign(base,{format,pools,swissRounds});
  delete base.qualifiers;
  const letters=poolLetters(base.pools||1); base.teams.forEach(t=>{if(t.pool&&!letters.includes(t.pool))t.pool=null});
  closeModal(); await saveT(base);
  if(id&&oldPlan!==planKey(base)&&(base.matches||[]).some(m=>!m.bye&&!scored(m))){
    if((base.matches||[]).some(scored)) toast("Planning modifié : utilise « 🕒 Planifier » pour mettre à jour les matchs restants",5000);
    else{await replanAll(id);toast("Terrains et horaires recalculés")}
  }
  if(!id) go({v:"tournoi",id:base.id,tab:"equipes"});
}
async function delTournament(id){if(!await ask(`Supprimer « ${tournaments[id].name} » et tous ses résultats ?`))return;go({v:"tournois"});await deleteTournamentDocs(id)}
async function setStatus(id,s){const T=getT(id);T.status=s;await saveT(T)}
async function closeT(id){
  const T=getT(id), unplayed=(T.matches||[]).filter(m=>!m.bye&&!scored(m)).length;
  if(!bracketOutcome(T).first&&!await ask("La finale n'a pas de score : aucun podium ne sera attribué. Clôturer quand même ?"))return;
  if(unplayed&&!await ask(`${unplayed} match(s) sans score seront ignorés. Continuer ?`))return;
  T.status="done"; await saveT(T); await archiveTournament(id); toast("Tournoi clôturé, bonus attribués"); go({v:"tournoi",id,tab:"classement"});
}

/* ---------- Démo ---------- */
function makeDemoData(){
  let seed=Date.now()%100000;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const gauss=()=>{let u=R()||1e-9,v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const MEN=["Hugo M.","Lucas B.","Yanis K.","Théo R.","Nathan D.","Mehdi A.","Enzo P.","Louis G.","Karim S.","Maxime L.","Antoine V.","Bilal H.","Romain C.","Jules F.","Ilyes T.","Quentin N.","Adrien W.","Samy O."];
  const WOM=["Léa M.","Inès B.","Camille R.","Sarah K.","Manon D.","Chloé P.","Yasmine A.","Lucie G.","Emma T.","Nora S."];
  const P={},skill={};
  MEN.forEach(n=>{const id=uid();P[id]={name:n+" (démo)",g:"H",demo:true,createdAt:Date.now()};skill[id]=1000+gauss()*140});
  WOM.forEach(n=>{const id=uid();P[id]={name:n+" (démo)",g:"F",demo:true,createdAt:Date.now()};skill[id]=820+gauss()*120});
  const NAMES=["Big Ballers","Les Pivots","Street Kings","Mi-Temps","Zone 2-3","Pick & Roll","Les Fadas","Panier Express","Raquette Fantôme","Les Tontons","No Look","Run & Gun","Les Écureuils","Air Ball"];
  const ids=Object.keys(P);
  const mkTeams=()=>{for(;;){const att=sh(ids).slice(0,24+Math.floor(R()*4));const girls=sh(att.filter(i=>P[i].g==="F")),boys=sh(att.filter(i=>P[i].g==="H")),out=[];
    if(girls.length>=5)out.push(girls.splice(0,3));
    while(out.length<8){const t=[],size=R()<.4?4:3;if(girls.length&&R()<.75)t.push(girls.shift());while(t.length<size&&boys.length)t.push(boys.shift());while(t.length<size&&girls.length)t.push(girls.shift());if(t.length<3)break;out.push(t)}
    if(out.length===8){const nm=sh(NAMES);return out.map((r,i)=>({id:uid(),name:nm[i],pool:null,roster:r}))}}};
  const play=(T,m)=>{const s=id=>{const t=T.teams.find(x=>x.id===id);return t.roster.reduce((a,p)=>a+skill[p],0)/t.roster.length};
    const aW=R()<1/(1+Math.pow(10,(s(m.b)-s(m.a))/400)),w=R()<.6?21:13+Math.floor(R()*8),l=Math.max(4,w-2-Math.floor(R()*10));m.sa=aW?w:l;m.sb=aW?l:w;m.time="";};
  const Ts=[];
  [["Open d'automne (démo)","2027-10-09"],["Tournoi de Noël (démo)","2027-12-18"],["Hivernal 3x3 (démo)","2028-02-12"],["Printemps Ballers (démo)","2028-04-15"]].forEach(([name,date],k)=>{
    const swiss=k===1;
    const T={id:uid(),name,date,place:"Gymnase du club",format:swiss?"swiss":"pools",pools:2,swissRounds:4,bracketSize:4,status:"planned",season:cfg().season,teams:mkTeams(),matches:[],createdAt:Date.now()+k,demo:true};
    const playAll=()=>T.matches.filter(m=>!m.bye&&!scored(m)).forEach(m=>play(T,m));
    if(swiss){if(k<3)for(let r=0;r<4;r++){genSwissRound(T);playAll()}}
    else{T.teams.forEach((t,i)=>t.pool=i<4?"A":"B"); genPoolMatches(T); if(k<3) playAll();}
    if(k<3){genBracket(T);playAll();genNextRound(T);playAll();T.status="done"}
    else T.matches.forEach((m,i)=>{m.time=`${10+Math.floor(i/2)}:${i%2?"30":"00"}`;m.court=String(i%2+1)});
    Ts.push(T);
  });
  return {P,Ts};
}
async function makeDemo(){
  if(!await ask("Générer une saison de démo (28 joueurs, 4 tournois) ?"))return;
  const {P,Ts}=makeDemoData(); toast("Création de la démo…",8000);
  for(const [id,p] of Object.entries(P)) await saveP(id,p);

  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Équipes équilibrées (session) ---------- */
function sessionBalanced(){
  const T=tournaments[SS.tid], busy=sessionBusy(T), w=sessionWait(T), C=cfg();
  const avail=(T.present||[]).filter(p=>players[p]&&!busy.has(p));
  if(avail.length<2) return toast("Pas assez de joueurs disponibles");
  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const n=Math.min(avail.length,SS.size*2), picked=sh(avail).sort((a,b)=>w[b]-w[a]).slice(0,n);
  const eff=p=>(st[p]?.mmr??C.mmrStart)-(players[p]?.g==="F"?C.handicap:0);
  const k=Math.ceil(n/2); let best=null;
  const rec=(start,cur)=>{if(cur.length===k){const A=cur,B=picked.filter(p=>!A.includes(p));const fa=A.reduce((s,p)=>s+eff(p),0)/A.length,fb=B.length?B.reduce((s,p)=>s+eff(p),0)/B.length:0;const d=Math.abs(fa-fb)+Math.random()*8;if(!best||d<best.d)best={d,A:[...A]};return}
    for(let i=start;i<picked.length;i++){cur.push(picked[i]);rec(i+1,cur);cur.pop()}};
  rec(0,[]);
  SS.sel={}; picked.forEach(p=>SS.sel[p]=best.A.includes(p)?1:2);
  const A=picked.filter(p=>SS.sel[p]===1),B=picked.filter(p=>SS.sel[p]===2);
  const ea=expected(A.reduce((s,p)=>s+eff(p),0)/A.length,B.reduce((s,p)=>s+eff(p),0)/B.length);
  toast(`Équipes équilibrées : ${Math.round(ea*100)} % / ${Math.round((1-ea)*100)} %`,3000);
  render();
}

let DUEL={a:"",b:""};
function openDuel(a,b){DUEL={a:a||"",b:b||""};go({v:"duel"})}
function duelData(a,b){
  const vs={g:0,w:0,n:0,l:0,d:0,list:[]}, tog={g:0,w:0,n:0,l:0,d:0};
  for(const T of sortedTournaments()){const R=RES[T.id];if(!R)continue;
    for(const m of (T.matches||[])){if(!scored(m)||!R.matchInfo[m.id])continue;const A=teamOf(T,m.a),B=teamOf(T,m.b);if(!A||!B)continue;
      const aSide=A.roster.includes(a)?"A":B.roster.includes(a)?"B":null, bSide=A.roster.includes(b)?"A":B.roster.includes(b)?"B":null;
      if(!aSide||!bSide)continue;
      const me=aSide==="A"?m.sa:m.sb, op=aSide==="A"?m.sb:m.sa, d=me-op, r=d>0?"w":d<0?"l":"n";
      const o=aSide===bSide?tog:vs; o.g++;o[r]++;o.d+=d;
      if(o===vs) vs.list.push({T,m,me,op,mine:aSide==="A"?A:B,them:aSide==="A"?B:A});
    }}
  vs.list.reverse(); return {vs,tog};
}

/* ---------- Trophées de la saison ---------- */
function seasonPlayerStats(season){
  const C=cfg(), out={};
  for(const T of sortedTournaments()){if(seasonOf(T,C)!==season)continue;const R=RES[T.id];if(!R)continue;
    for(const m of (T.matches||[])){if(!scored(m)||!R.matchInfo[m.id])continue;const A=teamOf(T,m.a),B=teamOf(T,m.b);if(!A||!B)continue;
      [[A,m.sa,m.sb],[B,m.sb,m.sa]].forEach(([tm,me,op])=>tm.roster.forEach(p=>{if(!players[p])return;const o=out[p]||(out[p]={g:0,w:0,pf:0,pa:0,close:0,cur:0,best:0});
        o.g++;o.pf+=me;o.pa+=op;if(me>op){o.w++;o.cur++;o.best=Math.max(o.best,o.cur);if(me-op<=2)o.close++}else o.cur=0}))}}
  return out;
}
function trophiesHTML(g){
  const C=cfg(), S=seasonPlayerStats(C.season), ids=Object.keys(S).filter(p=>players[p]?.g===g);

/* ---------- Doublons & fusion de joueurs ---------- */
const normName=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\(demo\)/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function dupPairs(){
  const ids=Object.keys(players),out=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const a=normName(players[ids[i]].name).split(" "),b=normName(players[ids[j]].name).split(" ");
    const same=a.join(" ")===b.join(" ")||(a.length>1&&b.length>1&&a[0]===b[0]&&a[1][0]===b[1][0]&&(a[1].length===1||b[1].length===1||a[1]===b[1]));
    if(same) out.push([ids[i],ids[j]]);
  }
  return out.slice(0,30);
}
function mMerge(a,b){
  const lab=id=>`${esc(players[id].name)} <span class="muted">(${st[id]?.gamesAll||0} matchs)</span>`;
  modal(`<h3>Fusionner deux fiches</h3><div class="muted">Les tournois de la fiche supprimée sont transférés sur la fiche conservée. Le classement est recalculé.</div>
  <label>Fiche à conserver</label>
  <div class="plist"><label><input type="radio" name="keep" value="${a}" checked> ${lab(a)}</label><label><input type="radio" name="keep" value="${b}"> ${lab(b)}</label></div>
  <div class="row" style="margin-top:14px"><button class="btn" onclick="doMerge('${a}','${b}')">Fusionner</button><button class="btn sec" onclick="closeModal()">Annuler</button></div>`);
}
async function doMerge(a,b){
  const keep=document.querySelector('input[name="keep"]:checked').value, drop=keep===a?b:a;
  const changed=[], conflicts=[];
  for(const id in tRaw){const T=getT(id);let hit=false;
    const tk=T.teams.find(t=>t.roster.includes(keep)), td=T.teams.find(t=>t.roster.includes(drop));
    if(td&&tk&&tk.id!==td.id){conflicts.push(T.name);continue}
    if((T.present||[]).includes(drop)){hit=true;T.present=[...new Set(T.present.map(p=>p===drop?keep:p))]}
    T.teams.forEach(t=>{if(t.roster.includes(drop)){hit=true;t.roster=t.roster.filter(p=>p!==drop);if(!t.roster.includes(keep))t.roster.push(keep)}});
    if(hit) changed.push(T);}
  if(conflicts.length){closeModal();return toast(`Impossible : les deux fiches jouent dans 2 équipes différentes (${conflicts.join(", ")})`,5000)}
  closeModal();
  for(const T of changed) await saveT(T);
  delete players[drop];scheduleRender();await delDoc("players/"+drop);
  toast(`Fiches fusionnées (${changed.length} tournoi(s) mis à jour)`);
}

/* ---------- Calibrage ---------- */
let calibBest=null;
function calibMatches(){
  const out=[];
  for(const T of sortedTournaments()){const R=RES[T.id];if(!R)continue;
    (T.matches||[]).forEach(m=>{const i=R.matchInfo[m.id];if(!i||!scored(m))return;const A=teamOf(T,m.a),B=teamOf(T,m.b);if(!A||!B)return;
      const fr=t=>t.roster.filter(p=>players[p]?.g==="F").length/t.roster.length;
      out.push({EA:i.EA,aWon:m.sa>m.sb,S:resOf(m.sa,m.sb),gap:i.gap,fa:fr(A),fb:fr(B)})})}
  return out;
}
const logLoss=ms=>ms.reduce((a,m)=>{const p=Math.min(.999,Math.max(.001,m.EA));return a-(m.S*Math.log(p)+(1-m.S)*Math.log(1-p))},0)/Math.max(1,ms.length);
function runCalibration(){
  const base=cfg(), res=[];
  for(let h=0;h<=400;h+=25){compute({...base,handicap:h});const ms=calibMatches().filter(m=>m.fa!==m.fb);res.push({h,ll:logLoss(ms),n:ms.length})}
  compute(); res.sort((a,b)=>a.ll-b.ll); calibBest=res[0]; render();
}

      txt(team.name,{size:i===0?66:56,y:cy-12,xx:230,align:"left",maxW:W-320,fill:i===0?"fire":"#fff",glow:i===0});
      txt(team.roster.map(p=>clean(players[p]?.name||"")).join("  ·  "),{size:28,weight:500,font:"Inter",y:cy+40,xx:230,align:"left",maxW:W-320,fill:"#d9d2c9",upper:false});
      y+=bh;});
  } else if(kind==="mvp"){
    const cand=Object.keys(st).filter(p=>st[p].byT[tid]).sort((a,b)=>st[b].byT[tid].total-st[a].byT[tid].total||st[b].byT[tid].match-st[a].byT[tid].match);
    if(!cand.length) throw new Error("aucun joueur dans ce tournoi");
    const p=cand[0], b=st[p].byT[tid], team=teamOf(T,b.team), logs=st[p].log.filter(l=>l.tid===tid), w=logs.filter(l=>l.won).length, dn=logs.filter(l=>l.res===.5).length;
    y+=72; txt(players[p].g==="F"?"Joueuse du tournoi":"Joueur du tournoi",{size:84,y,glow:"rgba(255,255,255,.35)"}); y+=60;
    txt(T.name,{size:44,y,fill:"fire",glow:true}); y+=50; dotted(y); y+=150;
    txt(clean(players[p].name),{size:120,y,glow:true}); y+=70;
    txt(team?.name||"",{size:40,weight:500,y,fill:"#bdb5ab"}); y+=200;
    txt("+"+b.total,{size:220,y,fill:"fire",glow:true}); y+=60;
    txt("points gagnés",{size:38,weight:500,y,fill:"#d9d2c9"}); y+=90;
    txt(`${w} victoire${w>1?"s":""}${dn?` · ${dn} nul${dn>1?"s":""}`:""} · ${logs.length-w-dn} défaite${logs.length-w-dn>1?"s":""}${b.place?` · ${b.place}${b.place===1?"re":"e"} place`:""}`,{size:36,weight:500,font:"Inter",y,fill:"#fff",upper:false});
  } else {
    const g=kind==="topH"?"H":"F", list=Object.keys(players).filter(id=>players[id].g===g&&st[id]?.games>0).sort((a,b)=>st[b].pts-st[a].pts||st[b].wins-st[a].wins).slice(0,10);
    const last=sortedTournaments().filter(t=>t.status==="done"&&seasonOf(t,C)===C.season).pop();
    y+=100; txt("Top 10",{size:118,y,glow:"rgba(255,255,255,.35)"}); y+=74;
    txt(g==="H"?"Classement Hommes":"Classement Femmes",{size:52,y,fill:"fire",glow:true}); y+=44;
    txt(`Saison ${C.season}${last?" · après "+last.name:""}`,{size:28,weight:500,font:"Inter",y,fill:"#bdb5ab",upper:false}); y+=34; dotted(y); y+=18;
    const rh=Math.min(74,(H-150-y)/Math.max(1,list.length));
    list.forEach((id,i)=>{const yy=y+rh*i+rh*.68;
      if(i<3){x.save();x.fillStyle="rgba(255,140,0,.09)";x.fillRect(60,y+rh*i+4,W-120,rh-8);x.restore()}
      txt(String(i+1),{size:44,y:yy,xx:110,fill:i<3?"fire":"#9a938b"});
      txt(clean(players[id].name),{size:40,weight:500,y:yy,xx:170,align:"left",maxW:600});
      txt(st[id].pts+" pts",{size:44,y:yy,xx:W-80,align:"right",fill:"fire",upper:false});});
    if(!list.length) txt("Aucun match joué",{size:40,y:y+120,fill:"#9a938b"});
  }
  dotted(H-108);
  txt("Vergèze Basket Club",{size:30,weight:500,y:H-60,fill:"#d9a46b"});
  txt(C.league,{size:22,weight:500,y:H-28,fill:"#8f857b"});
  return cv;
}

/* ---------- Site public (export autonome) ---------- */
async function exportPublic(){
  const withDemo=document.getElementById("pubDemo")?.checked;
  const P={},TT={};
  for(const id in players) if(withDemo||!players[id].demo) P[id]=players[id];
  for(const id in tournaments) if(withDemo||!tournaments[id].demo) TT[id]=tournaments[id];
  const {roles,...pubCfg}=cfgDoc; const snap={players:P,tournaments:TT,config:pubCfg,exportedAt:Date.now()};
  const doc=new DOMParser().parseFromString(PAGE_SRC,"text/html");
  doc.querySelectorAll("script:not(#app-js)").forEach(s=>s.remove());
  doc.getElementById("app").innerHTML='<div class="empty">Chargement…</div>';
  const s=doc.createElement("script");s.textContent="window.__SNAPSHOT__="+JSON.stringify(snap).replace(/</g,"\\u003c")+";";
  doc.getElementById("app-js").before(s);
  const html="<!DOCTYPE html>\n"+doc.documentElement.outerHTML;
  if(await dlFile("index.html",html,"text/html")) toast("Fichier prêt");
}

/* ---------- Modale & confirmation ---------- */
function modal(html){document.getElementById("mbox").innerHTML=html;document.getElementById("modal").classList.add("on")}
function closeModal(){document.getElementById("modal").classList.remove("on");document.getElementById("mbox").innerHTML=""}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
let askRes=null;
function ask(text){return new Promise(res=>{askRes=res;modal(`<div style="margin-bottom:14px">${esc(text)}</div><div class="row"><button class="btn" onclick="answer(true)">Confirmer</button><button class="btn sec" onclick="answer(false)">Annuler</button></div>`)})}
function answer(v){closeModal();const r=askRes;askRes=null;r&&r(v)}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
route=parseHash();
if(window.__SNAPSHOT__){
  SNAP=window.__SNAPSHOT__; players=SNAP.players||{}; tRaw=SNAP.tournaments||{}; cfgDoc=SNAP.config||{};
  loaded.p=loaded.t=loaded.c=true; mergeAll(); compute(); maybeHome();
}
render();
if(!SNAP)(async()=>{
  try{
    if(!window.firebase||!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.projectId) throw new Error("config");
    firebase.initializeApp(window.FIREBASE_CONFIG);
    DB=firebase.firestore(); AUTH=firebase.auth();
    try{await DB.enablePersistence({synchronizeTabs:true})}catch(e){}
  }catch(e){DB=null;loadNote="Configuration Firebase manquante";render();return}
  loadTimer=setTimeout(()=>{loadNote="Les données mettent du temps à arriver… vérifie ta connexion.";render()},10000);
  const done=()=>{if(loaded.p&&loaded.t){clearTimeout(loadTimer);if(loadNote.startsWith("Les données"))loadNote=""}scheduleRender();maybeHome()};
  const err=e=>{clearTimeout(loadTimer);loadNote="Erreur de chargement : "+(e?.code||"inconnue");loaded.p=loaded.t=true;render()};
  DB.collection("players").onSnapshot(s=>{players={};s.docs.forEach(d=>players[d.id]=clone(d.data()));if(!s.metadata.fromCache)loaded.p=true;else loaded.p=loaded.p||s.size>0;done()},err);
  DB.collection("tournaments").onSnapshot(s=>{tRaw={};s.docs.forEach(d=>tRaw[d.id]=clone(d.data()));mergeAll();if(!s.metadata.fromCache)loaded.t=true;else loaded.t=loaded.t||s.size>0;done()},err);
  DB.collection("scores").onSnapshot(s=>{scoresMap={};s.docs.forEach(d=>scoresMap[d.id]=clone(d.data()));mergeAll();scheduleRender()},()=>{});
  DB.doc("config/main").onSnapshot(s=>{cfgDoc=s.exists?clone(s.data()):{};loaded.c=true;scheduleRender()},()=>{});
  DB.doc("config/roles").onSnapshot(s=>{ROLES=s.exists?clone(s.data()):{};computeRole();scheduleRender()},()=>{});
  let memUnsub=null;
  AUTH.onAuthStateChanged(u=>{
    FBUSER=u; MYID=u?.uid||null; computeRole(); render();
    if(memUnsub){memUnsub();memUnsub=null;members={}}
    if(u){write("members/"+u.uid,()=>DB.doc("members/"+u.uid).set({name:u.displayName||"",email:u.email||"",seen:Date.now()}));
      memUnsub=DB.collection("members").onSnapshot(s=>{members={};s.docs.forEach(d=>members[d.id]=clone(d.data()));if(route.v==="acces")scheduleRender()},()=>{});
    }
  });
})();
